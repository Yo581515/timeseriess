services:

  disk_timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${DISKTEST_TIMESCALEDB_USER}
      POSTGRES_PASSWORD: ${DISKTEST_TIMESCALEDB_PASSWORD}
      POSTGRES_DB: ${DISKTEST_TIMESCALEDB_DATABASE}
    ports:
      - "${DISKTEST_TIMESCALEDB_PORT}:5432"
    volumes:
      - disk_timescale_data:/var/lib/postgresql/data
      - ./init-timescaledb:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DISKTEST_TIMESCALEDB_USER} -d ${DISKTEST_TIMESCALEDB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  disk_mongodb:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DISKTEST_MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DISKTEST_MONGODB_PASSWORD}
    ports:
      - "${DISKTEST_MONGODB_PORT}:27017"
    volumes:
      - disk_mongo_data:/data/db
      - ./init-mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  disk_influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${DISKTEST_INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DISKTEST_INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${DISKTEST_INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DISKTEST_INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DISKTEST_INFLUXDB_TOKEN}
    ports:
      - "${DISKTEST_INFLUXDB_PORT}:8086"
    volumes:
      - disk_influx_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  disk_timescale_data:
  disk_mongo_data:
  disk_influx_data: